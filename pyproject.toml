[project]
name = "qwen38-modal-deploy"
version = "0.1.0"
description = "Modal deployment tooling for Qwen3.8-27B on SGLang"
requires-python = ">=3.11,<3.15"
dependencies = [
    "modal[api-proxy-support]==1.6.4",
    "modal-benchmark==0.2.2",
]


# Public PyPI only for this newly released package; keep the configured
# default mirror for existing pinned dependencies.
[tool.uv.sources]
modal-benchmark = { index = "pypi" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true
